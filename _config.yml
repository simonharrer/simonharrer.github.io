# sitemap.xml is generated by tools/build-sitemap.py and committed, so there is
# no jekyll-sitemap here. The plugin took lastmod from file mtime, and GitHub
# Pages checks out fresh on every build, so all sixteen URLs carried the same
# build timestamp. The script reads git history instead, giving each page the
# date its content actually changed.
markdown: kramdown
title: Dr. Simon Harrer
url: https://simonharrer.com

# legal.md is the source for the hand-maintained legal.html. Publishing it
# duplicated legal.html in the sitemap and served the raw markdown at
# /legal.md. tools/ holds build scripts that are not part of the site.
exclude:
  - legal.md
  - tools
